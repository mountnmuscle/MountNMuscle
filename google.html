<head>

<style>
:root{--cream:#FAF6EE;--ink:#1A1712;--ink-3:#6E6455;--bronze-deep:#7A5C1E;--bronze:#B08B3F;--bronze-hi:#E8CC8A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);
 min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}

p{color:var(--ink-3);font-size:.95rem;line-height:1.6;margin-bottom:22px}
a.btn{display:inline-block;background:linear-gradient(135deg,var(--bronze),var(--bronze-hi) 52%,var(--bronze));
 color:var(--ink);font-weight:700;text-decoration:none;padding:15px 30px;font-size:1rem}
a.alt{display:block;margin-top:18px;color:var(--ink-3);font-size:.85rem}
